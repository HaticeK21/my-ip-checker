<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My IP Checker</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #050505;
            color: #00ff88;
            font-family: monospace;
            padding: 20px;
        }

        .box {
            width: 100%;
            max-width: 550px;
            border: 1px solid #00ff88;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 0 25px rgba(0, 255, 136, 0.15);
        }

        h1 {
            text-align: center;
            margin-top: 0;
        }

        .subtitle {
            text-align: center;
            color: #aaa;
            margin-bottom: 30px;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #00ff88;
            color: #000;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #00cc6a;
        }

        .result {
            margin-top: 25px;
            padding: 20px;
            border: 1px solid #164d35;
            border-radius: 8px;
            background: #080f0b;
            min-height: 80px;
        }

        .label {
            color: #aaa;
        }

        .ip {
            font-size: 24px;
            margin-top: 8px;
            word-break: break-all;
        }

        .status {
            margin-top: 15px;
            color: #aaa;
        }

        .footer {
            text-align: center;
            color: #555;
            margin-top: 25px;
            font-size: 12px;
        }
    </style>
</head>

<body>

<div class="box">
    <h1>MY IP CHECKER</h1>

    <div class="subtitle">
        Simple Cyber Security Tool
    </div>

    <button onclick="checkIP()">
        CHECK MY IP
    </button>

    <div class="result">
        <div class="label">YOUR PUBLIC IP</div>
        <div class="ip" id="ip">---</div>
        <div class="status" id="status">
            IP adresini öğrenmek için butona bas.
        </div>
    </div>

    <div class="footer">
        Use responsibly • Your IP is sensitive information
    </div>
</div>

<script>
async function checkIP() {
    const ipElement = document.getElementById("ip");
    const statusElement = document.getElementById("status");

    ipElement.textContent = "...";
    statusElement.textContent = "IP adresi kontrol ediliyor...";

    try {
        const response = await fetch("https://api.ipify.org?format=json");

        if (!response.ok) {
            throw new Error("Request failed");
        }

        const data = await response.json();

        ipElement.textContent = data.ip;
        statusElement.textContent = "Public IP başarıyla bulundu.";
    } catch (error) {
        ipElement.textContent = "Bulunamadı";
        statusElement.textContent =
            "IP alınamadı. İnternet bağlantını kontrol et.";
    }
}
</script>

</body>
</html>
